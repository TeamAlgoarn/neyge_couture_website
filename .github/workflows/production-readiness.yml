name: Production Readiness

on:
  pull_request:
  push:
    branches:
      - integration/neyge-15-day-sprint

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    env:
      VITE_SITE_ENV: staging
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_PAYMENTS_ENABLED: "false"
      VITE_RAZORPAY_ENABLED: "false"
    defaults:
      run:
        working-directory: HandloomSarees/Ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HandloomSarees/Ecommerce/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HandloomSarees/server
    env:
      APP_ENV: test
      DEBUG: "false"
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
      JWT_SECRET: jwt-placeholder-for-ci
      JWT_ALGORITHM: HS256
      PAYMENTS_ENABLED: "false"
      RAZORPAY_ENABLED: "true"
      RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: razorpay-placeholder
      RAZORPAY_WEBHOOK_SECRET: webhook-placeholder
      CLOUDINARY_CLOUD_NAME: cloud
      CLOUDINARY_API_KEY: cloud-key
      CLOUDINARY_API_SECRET: cloud-secret
      WHATSAPP_ENABLED: "false"
      INSTAGRAM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: HandloomSarees/server/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m compileall app
      - run: python -m pytest

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - name: Block obvious live secrets
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          ignored_dirs = {
              ".git",
              ".codex-preserved-stash-files",
              "node_modules",
              "dist",
              "build",
              ".venv",
              "venv",
              "__pycache__",
          }
          allowed_placeholder_values = re.compile(
              r"^(?:$|<[^>]+>|your[_-].*|replace[_-].*|placeholder.*|.*placeholder.*|test.*|jwt-placeholder.*|service-role-placeholder.*|webhook-placeholder.*|razorpay-placeholder.*)$",
              re.IGNORECASE,
          )
          direct_secret_assignment = re.compile(
              r"\b(RAZORPAY_KEY_SECRET|RAZORPAY_WEBHOOK_SECRET|SUPABASE_SERVICE_ROLE_KEY|JWT_SECRET)\s*=\s*([^\s#]+)",
              re.IGNORECASE,
          )
          patterns = [
              ("razorpay-live-key", re.compile(r"rzp_live_[A-Za-z0-9_]+")),
              ("stripe-live-key", re.compile(r"sk_live_[A-Za-z0-9_]+")),
              ("webhook-secret", re.compile(r"whsec_[A-Za-z0-9_]+")),
              ("private-key", re.compile(r"-----BEGIN (?:RSA |OPENSSH |EC |)PRIVATE KEY-----")),
          ]

          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if path.name == ".env":
                  continue
              if any(part in ignored_dirs for part in path.parts):
                  continue
              try:
                  lines = path.read_text(encoding="utf-8").splitlines()
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(lines, start=1):
                  for label, pattern in patterns:
                      if pattern.search(line):
                          hits.append((path, line_no, label))
                  if path.suffix.lower() in {".env", ".example", ".yaml", ".yml", ".md"}:
                      assignment = direct_secret_assignment.search(line)
                      if assignment:
                          value = assignment.group(2).strip().strip("\"'")
                          if not allowed_placeholder_values.match(value):
                              hits.append((path, line_no, "non-placeholder-secret-assignment"))

          if hits:
              for path, line_no, label in hits:
                  print(f"{path}:{line_no}: {label}")
              print("Possible committed live secret detected. Values were redacted.")
              sys.exit(1)
